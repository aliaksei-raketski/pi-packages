name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: write
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI-verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          filter: tree:0

      - name: Verify CI-verified release target
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "Expected CI commit $EXPECTED_SHA." >&2
            echo "Checked out $actual_sha instead." >&2
            exit 1
          fi

          git fetch origin main --no-tags
          if [ "$(git rev-parse origin/main)" != "$EXPECTED_SHA" ]; then
            echo "main advanced after CI." >&2
            echo "The newer commit must pass its own CI run." >&2
            exit 1
          fi

          git switch --force-create main --track origin/main

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-run checks and tests
        run: |
          pnpm run check
          pnpm run test

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Nx release without publishing
        id: nx_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          before_sha="$(git rev-parse HEAD)"
          pnpm run release
          after_sha="$(git rev-parse HEAD)"

          echo "before_sha=$before_sha" >> "$GITHUB_OUTPUT"
          if [ "$before_sha" != "$after_sha" ]; then
            echo "release_sha=$after_sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch npm publish workflow
        if: steps.nx_release.outputs.release_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ steps.nx_release.outputs.before_sha }}
          RELEASE_SHA: ${{ steps.nx_release.outputs.release_sha }}
        run: |
          set -euo pipefail

          payload_file="${RUNNER_TEMP}/publish-dispatch.json"
          PAYLOAD_FILE="$payload_file" \
            CI_SHA="$CI_SHA" \
            RELEASE_SHA="$RELEASE_SHA" \
            node <<'NODE'
          const fs = require('node:fs');

          const payload = {
            ref: 'main',
            inputs: {
              ci_sha: process.env.CI_SHA,
              release_sha: process.env.RELEASE_SHA,
            },
          };

          fs.writeFileSync(process.env.PAYLOAD_FILE, JSON.stringify(payload));
          NODE

          workflow_endpoint="repos/${GITHUB_REPOSITORY}/actions/workflows/publish-npm.yml/dispatches"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$workflow_endpoint" \
            --input "$payload_file"
