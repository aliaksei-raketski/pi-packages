name: Release

on:
  workflow_call:
    inputs:
      ci_sha:
        description: CI-verified commit to release.
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    outputs:
      ci_sha: ${{ steps.nx_release.outputs.before_sha }}
      release_sha: ${{ steps.nx_release.outputs.release_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI-verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ci_sha }}
          fetch-depth: 0
          filter: tree:0

      - name: Verify CI-verified release target
        env:
          EXPECTED_SHA: ${{ inputs.ci_sha }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "Expected CI commit $EXPECTED_SHA." >&2
            echo "Checked out $actual_sha instead." >&2
            exit 1
          fi

          git fetch origin main --no-tags
          if [ "$(git rev-parse origin/main)" != "$EXPECTED_SHA" ]; then
            echo "main advanced after CI." >&2
            echo "The newer commit must pass its own CI run." >&2
            exit 1
          fi

          git switch --force-create main --track origin/main

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure authenticated git push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Run Nx release without publishing
        id: nx_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          before_sha="$(git rev-parse HEAD)"
          pnpm run release
          after_sha="$(git rev-parse HEAD)"

          echo "before_sha=$before_sha" >> "$GITHUB_OUTPUT"
          if [ "$before_sha" != "$after_sha" ]; then
            echo "release_sha=$after_sha" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: release
    if: needs.release.outputs.release_sha != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
    with:
      ci_sha: ${{ needs.release.outputs.ci_sha }}
      release_sha: ${{ needs.release.outputs.release_sha }}
